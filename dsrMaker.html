<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSR Maker - Manager</title>
    <link rel="stylesheet" href="assets/normalize.css">
    <link rel="stylesheet" href="assets/theme.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/theme.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #fefbf6 0%, #fdf5e1 50%, #fae5ac 100%);
            color: #242424;
            -webkit-font-smoothing: antialiased;
        }

        .dashboard-container {
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .upload-card, .controls-card {
            background: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .upload-card:hover, .controls-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.06);
        }

        .upload-zone {
            transition: all 0.2s ease-in-out;
            border: 2px dashed #e2e8f0;
            background: #f8fafc;
        }

        .upload-zone.dragover {
            border-color: #6366f1;
            background-color: #eef2ff;
        }

        .btn-primary {
            background: #f4c74a;
            color: #0f172a;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background: #ca9e2b;
            transform: translateY(-2px);
        }

        /* Excel-like Table Styles */
        .excel-table-wrapper {
            background: white;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
        }

        .excel-table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px;
            min-width: 900px;
        }

        .excel-table th, .excel-table td {
            border: 1px solid #1f2937;
            padding: 4px 8px;
            white-space: nowrap;
        }

        .excel-table thead th {
            background-color: #d1fae5;
            font-weight: 700;
            text-align: center;
            color: #064e3b;
            border: 1px solid #1f2937;
        }
        
        .header-cell {
            background-color: #d1fae5 !important;
            font-weight: 700;
            color: #064e3b;
        }

        .sub-header {
            background-color: #e5e7eb;
            font-weight: 700;
            text-align: center;
        }

        .cat-row {
            background-color: #f3f4f6;
            font-weight: 600;
        }
        
        .cat-total-row {
            background-color: #ffedd5;
            font-weight: 700;
        }

        .grand-total-row {
            background-color: #fef08a;
            font-weight: 800;
        }

        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .text-left { text-align: left; }
        
        .divider-col {
            border-right: 3px solid #1f2937 !important;
        }

        input.inline-input {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            padding: 2px 4px;
            font-size: 13px;
            text-align: right;
            outline: none;
        }
        input.inline-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        /* Dark Mode */
        html.dark-mode, body.dark-mode {
            background: linear-gradient(135deg, #09090b 0%, #141417 50%, #1c1c21 100%);
            color: #f4f4f5;
            color-scheme: dark;
        }
        html.dark-mode .dashboard-container, body.dark-mode .dashboard-container {
            background: rgba(24, 24, 27, 0.7) !important;
            border-color: rgba(255, 255, 255, 0.06) !important;
        }
        html.dark-mode .upload-card, html.dark-mode .controls-card {
            background: #18181b;
            border-color: rgba(255, 255, 255, 0.07);
        }
        html.dark-mode .upload-zone {
            background: #09090b;
            border-color: rgba(255, 255, 255, 0.12);
        }
        html.dark-mode .excel-table-wrapper {
            background: #18181b;
            border-color: #3f3f46;
        }
        html.dark-mode .excel-table th, html.dark-mode .excel-table td {
            border-color: #52525b;
        }
        html.dark-mode .header-cell {
            background-color: #064e3b !important;
            color: #a7f3d0;
        }
        html.dark-mode .sub-header {
            background-color: #27272a;
        }
        html.dark-mode .cat-row {
            background-color: #27272a;
        }
        html.dark-mode .cat-total-row {
            background-color: #7c2d12;
            color: #ffedd5;
        }
        html.dark-mode .grand-total-row {
            background-color: #854d0e;
            color: #fef08a;
        }
        html.dark-mode input.inline-input {
            background: #27272a;
            color: #f4f4f5;
            border-color: #52525b;
        }
    </style>
</head>

<body class="py-4 sm:py-6 px-2 sm:px-4 md:px-6 min-h-screen">

    <div class="max-w-[1440px] mx-auto relative">
        <div class="dashboard-container rounded-[2.5rem] sm:rounded-[3rem] p-4 sm:p-8 md:p-10 border border-white/60 min-h-[92vh] flex flex-col">
            
            <!-- Header -->
            <div class="flex items-center justify-between mb-8 gap-4">
                <button onclick="window.location.href='index.html'" class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-white border border-neutral-100 text-neutral-600 hover:text-[#242424] hover:bg-neutral-50 transition shadow-sm font-semibold text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    Back to Dashboard
                </button>
                <h1 class="text-2xl font-bold text-[#242424]">Daily Sales Report</h1>
                <div class="w-24"></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
                <!-- Upload Section -->
                <div class="upload-card rounded-[2rem] p-6 lg:col-span-1">
                    <h3 class="font-bold text-[#242424] mb-4">1. Upload Sales Data</h3>
                    <div class="upload-zone rounded-2xl p-6 text-center cursor-pointer flex flex-col items-center gap-3" id="dz-dsr" onclick="document.getElementById('fi-dsr').click()">
                        <input type="file" id="fi-dsr" accept=".csv" class="hidden">
                        <svg class="w-8 h-8 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                        <p class="text-sm font-bold text-neutral-700">Drop Sales CSV here</p>
                        <p class="text-xs text-neutral-400 font-medium">or click to browse</p>
                    </div>
                </div>

                <!-- Controls Section -->
                <div class="controls-card rounded-[2rem] p-6 lg:col-span-2">
                    <h3 class="font-bold text-[#242424] mb-4">2. Report Settings</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-neutral-500 uppercase tracking-wider mb-2">Select Date</label>
                            <input type="date" id="dsrDate" class="w-full px-4 py-2 border border-neutral-300 rounded-xl outline-none focus:border-indigo-500 bg-white" onchange="generateReport()" />
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-neutral-500 uppercase tracking-wider mb-2">Select Store</label>
                            <select id="storeSelect" class="w-full px-4 py-2 border border-neutral-300 rounded-xl outline-none focus:border-indigo-500 bg-white" onchange="generateReport()">
                                <option value="">Upload Data First</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-neutral-500 uppercase tracking-wider mb-2">Walkins (For the Day)</label>
                            <input type="number" id="walkinsDay" placeholder="0" class="w-full px-4 py-2 border border-neutral-300 rounded-xl outline-none focus:border-indigo-500 bg-white" oninput="generateReport()" />
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-neutral-500 uppercase tracking-wider mb-2">Walkins (Month Till Date)</label>
                            <input type="number" id="walkinsMTD" placeholder="0" class="w-full px-4 py-2 border border-neutral-300 rounded-xl outline-none focus:border-indigo-500 bg-white" oninput="generateReport()" />
                        </div>
                    </div>
                </div>
            </div>

            <!-- Report Table -->
            <div class="excel-table-wrapper mb-6 flex-grow p-1">
                <div id="report-container" class="w-full overflow-x-auto pb-4">
                    <!-- Table rendered here -->
                    <div class="p-10 text-center text-neutral-400 font-medium">
                        Upload sales data and select settings to generate the DSR.
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        let rawData = [];
        let targets = {};
        let stores = [];
        
        // Product structure based on image layout
        const structure = [
            { category: 'Accessories.', type: 'Accessories' },
            { category: 'FABRIC', type: 'SUITINGS' },
            { category: 'FABRIC', type: 'SHIRTINGS' },
            { category: 'FABRIC', type: 'SUITLENGTHS' },
            { category: 'FABRIC', type: 'COATLENGTHS' },
            { category: 'Ready made', type: 'SUITS' },
            { category: 'Ready made', type: 'SHIRTS' },
            { category: 'Ready made', type: 'JACKETS' },
            { category: 'Ready made', type: 'LONGSUITS' },
            { category: 'Ready made', type: 'TROUSERS' },
            { category: 'Ready made', type: 'WAISTCOATS' },
            { category: 'Tailoring', type: 'Tailoring coat' },
            { category: 'Tailoring', type: 'Tailoring Trousers' },
            { category: 'Tailoring', type: 'Tailoring Shirts' },
            { category: 'Tailoring', type: 'Tailoring w/coat' },
            { category: 'Tailoring', type: 'EMBROIDERY' }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            setupUpload();
            // Load saved targets from target.html's storage
            const savedTargets = localStorage.getItem('target_achievement_targets');
            if (savedTargets) {
                targets = JSON.parse(savedTargets);
            }
            
            // Default date
            document.getElementById('dsrDate').value = new Date().toISOString().split('T')[0];
            
            // Check if we have raw data from target.html
            const savedData = localStorage.getItem('target_achievement_data');
            if (savedData) {
                rawData = JSON.parse(savedData);
                populateStores();
                generateReport();
            }
        });

        function setupUpload() {
            const dz = document.getElementById('dz-dsr');
            const fi = document.getElementById('fi-dsr');

            ['dragover', 'dragenter'].forEach(e => dz.addEventListener(e, ev => { ev.preventDefault(); dz.classList.add('dragover'); }));
            ['dragleave', 'drop'].forEach(e => dz.addEventListener(e, ev => { ev.preventDefault(); dz.classList.remove('dragover'); }));

            dz.addEventListener('drop', e => {
                const f = e.dataTransfer.files[0];
                if (f && f.name.endsWith('.csv')) processFile(f);
            });
            fi.addEventListener('change', e => { if (e.target.files[0]) processFile(e.target.files[0]); });
        }

        function processFile(file) {
            const r = new FileReader();
            r.onload = function(e) {
                const rows = parseCSV(e.target.result);
                if (rows.length) {
                    rawData = rows;
                    localStorage.setItem('target_achievement_data', JSON.stringify(rawData)); // Share with target.html
                    populateStores();
                    generateReport();
                }
            };
            r.readAsText(file);
        }

        function parseCSV(text) {
            const lines = text.split(/\r?\n/).filter(l => l.trim());
            if (lines.length < 2) return [];
            const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/^"|"$/g, ''));
            const out = [];
            for (let i = 1; i < lines.length; i++) {
                const vals = lines[i].split(',').map(v => v.trim().replace(/^"|"$/g, ''));
                const row = {};
                headers.forEach((h, idx) => row[h] = vals[idx] || '');
                out.push(row);
            }
            return out;
        }

        function getCol(row, possibleNames) {
            for (let name of possibleNames) {
                if (row[name] !== undefined) return row[name];
            }
            return '';
        }

        function normalizeCategory(cat) {
            cat = cat.trim();
            if (cat.toLowerCase().replace(/\s/g, '') === 'readymade') return 'Ready made';
            if (cat.toLowerCase() === 'tailoring') return 'Tailoring';
            if (cat.toLowerCase() === 'fabric') return 'FABRIC';
            if (cat.toLowerCase() === 'accessories') return 'Accessories.';
            return cat;
        }

        function populateStores() {
            const storeSet = new Set();
            rawData.forEach(r => {
                const store = getCol(r, ['site_descr', 'store name', 'store', 'location']).trim();
                if (store) storeSet.add(store);
            });
            stores = Array.from(storeSet).sort();
            const select = document.getElementById('storeSelect');
            select.innerHTML = '';
            stores.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                select.appendChild(opt);
            });
        }

        function formatCurrency(val) {
            if (!val || isNaN(val)) return '0.00';
            return parseFloat(val).toFixed(2);
        }
        
        function formatPct(val) {
            if (!val || isNaN(val)) return '0%';
            return Math.round(val) + '%';
        }

        function generateReport() {
            if (!rawData.length) return;
            const selDate = document.getElementById('dsrDate').value;
            const store = document.getElementById('storeSelect').value;
            if (!selDate || !store) return;

            const dateObj = new Date(selDate);
            const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const monthStr = monthNames[dateObj.getMonth()] + '-' + String(dateObj.getFullYear()).substring(2);
            const dayStr = dateObj.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
            const displayDateStr = monthNames[dateObj.getMonth()] + '-' + String(dateObj.getDate()).padStart(2, '0');

            const ftdWalkins = parseInt(document.getElementById('walkinsDay').value) || 0;
            const mtdWalkins = parseInt(document.getElementById('walkinsMTD').value) || 0;

            // Filter data for MTD and FTD
            const mtdData = [];
            const ftdData = [];
            
            const selMonth = dateObj.getMonth();
            const selYear = dateObj.getFullYear();
            
            rawData.forEach(r => {
                const rStore = getCol(r, ['site_descr', 'store name', 'store', 'location']).trim();
                if (rStore !== store) return;

                const rDateStr = getCol(r, ['order_date', 'date', 'bill_date', 'posting_date']);
                if (!rDateStr) return;
                
                // Parse DD-MM-YYYY or YYYY-MM-DD
                let rDate;
                if (rDateStr.includes('-')) {
                    const parts = rDateStr.split('-');
                    if (parts[0].length === 4) {
                        rDate = new Date(rDateStr);
                    } else {
                        // Assume DD-MM-YYYY
                        rDate = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
                    }
                } else if (rDateStr.includes('/')) {
                    const parts = rDateStr.split('/');
                    // Assume DD/MM/YYYY
                    rDate = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
                } else {
                    rDate = new Date(rDateStr);
                }

                if (isNaN(rDate)) return;

                // Check MTD (Same month and year, date <= selected date)
                if (rDate.getMonth() === selMonth && rDate.getFullYear() === selYear && rDate.getDate() <= dateObj.getDate()) {
                    mtdData.push(r);
                    if (rDate.getDate() === dateObj.getDate()) {
                        ftdData.push(r);
                    }
                }
            });

            // Calculate KPIs
            function calcKpis(data) {
                let sales = 0;
                let bills = new Set();
                let qty = 0;
                
                data.forEach(r => {
                    const amt = parseFloat(getCol(r, ['item_total', 'amount', 'net_amount', 'sales', 'sale amount'])) || 0;
                    const q = parseFloat(getCol(r, ['order_quantity', 'qty', 'quantity'])) || 0;
                    const bill = getCol(r, ['sale_order', 'bill_no', 'invoice_no', 'doc_no']);
                    
                    sales += amt;
                    qty += q;
                    if (bill) bills.add(bill);
                });
                
                return { sales, bills: bills.size, qty };
            }

            const ftdKpi = calcKpis(ftdData);
            const mtdKpi = calcKpis(mtdData);

            const ftdConv = ftdWalkins ? (ftdKpi.bills / ftdWalkins * 100) : 0;
            const ftdAtv = ftdKpi.bills ? (ftdKpi.sales / ftdKpi.bills) : 0;
            const ftdBs = ftdKpi.bills ? (ftdKpi.qty / ftdKpi.bills) : 0;

            const mtdConv = mtdWalkins ? (mtdKpi.bills / mtdWalkins * 100) : 0;
            const mtdAtv = mtdKpi.bills ? (mtdKpi.sales / mtdKpi.bills) : 0;
            const mtdBs = mtdKpi.bills ? (mtdKpi.qty / mtdKpi.bills) : 0;

            // Generate HTML
            let html = `
            <table class="excel-table">
                <thead>
                    <tr>
                        <th class="text-left header-cell">Location</th>
                        <th class="header-cell" colspan="2">${store}</th>
                        <th class="divider-col header-cell"></th>
                        <th class="text-left header-cell">Month</th>
                        <th class="header-cell" colspan="4">${monthStr}</th>
                    </tr>
                    <tr>
                        <th class="text-left header-cell">Date:-</th>
                        <th class="header-cell" colspan="2">${displayDateStr}</th>
                        <th class="divider-col header-cell"></th>
                        <th class="text-left header-cell">DAY</th>
                        <th class="header-cell" colspan="4">${dayStr}</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="font-bold"></td>
                        <td class="sub-header">Day</td>
                        <td class="sub-header"></td>
                        <td class="divider-col"></td>
                        <td class="sub-header">LY KPI</td>
                        <td class="sub-header">CY KPI</td>
                        <td class="sub-header">Growth</td>
                        <td class="sub-header"></td>
                        <td class="sub-header"></td>
                    </tr>
                    <tr>
                        <td>Sales</td>
                        <td class="text-right font-bold">${formatCurrency(ftdKpi.sales)}</td>
                        <td></td>
                        <td class="divider-col"></td>
                        <td class="text-right">0</td>
                        <td class="text-right font-bold">${formatCurrency(mtdKpi.sales)}</td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>Walkins</td>
                        <td class="text-right">${ftdWalkins}</td>
                        <td></td>
                        <td class="divider-col"></td>
                        <td class="text-right">0</td>
                        <td class="text-right">${mtdWalkins}</td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>No. of Bills</td>
                        <td class="text-right">${ftdKpi.bills}</td>
                        <td></td>
                        <td class="divider-col"></td>
                        <td class="text-right">0</td>
                        <td class="text-right">${mtdKpi.bills}</td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>Conversion %</td>
                        <td class="text-right">${formatPct(ftdConv)}</td>
                        <td></td>
                        <td class="divider-col"></td>
                        <td class="text-right">0%</td>
                        <td class="text-right">${formatPct(mtdConv)}</td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>Qty Sold</td>
                        <td class="text-right">${ftdKpi.qty.toFixed(1)}</td>
                        <td></td>
                        <td class="divider-col"></td>
                        <td class="text-right">0</td>
                        <td class="text-right">${mtdKpi.qty.toFixed(1)}</td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>ATV</td>
                        <td class="text-right">${Math.round(ftdAtv)}</td>
                        <td></td>
                        <td class="divider-col"></td>
                        <td class="text-right">0</td>
                        <td class="text-right">${Math.round(mtdAtv)}</td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>Basket Size ( B.S )</td>
                        <td class="text-right">${ftdBs.toFixed(2)}</td>
                        <td></td>
                        <td class="divider-col"></td>
                        <td class="text-right">0.00</td>
                        <td class="text-right">${mtdBs.toFixed(2)}</td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td colspan="9" style="height: 10px; border-left: 0; border-right: 0;"></td>
                    </tr>
                    <tr>
                        <td colspan="3" class="sub-header" style="background:#d1fae5; color:#064e3b;">Category Target - For the Day</td>
                        <td class="divider-col"></td>
                        <td colspan="5" class="sub-header" style="background:#d1fae5; color:#064e3b;">Category Target - For MTD</td>
                    </tr>
                    <tr>
                        <td></td>
                        <td class="font-bold text-center" style="background:#e5e7eb;">Qty</td>
                        <td class="font-bold text-center" style="background:#e5e7eb;">Ach</td>
                        <td class="divider-col"></td>
                        <td class="font-bold text-center" style="background:#e5e7eb;">CY Qty Tar</td>
                        <td class="font-bold text-center" style="background:#e5e7eb;">LY Qty</td>
                        <td class="font-bold text-center" style="background:#e5e7eb;">CY Qty</td>
                        <td class="font-bold text-center" style="background:#e5e7eb;">Tar Ach%</td>
                        <td class="font-bold text-center" style="background:#e5e7eb;">Qty Growth</td>
                    </tr>
            `;

            // Process categories
            let ftdGrandAch = 0;
            let mtdGrandTar = 0;
            let mtdGrandCy = 0;

            const categories = [...new Set(structure.map(s => s.category))];
            
            categories.forEach(cat => {
                const types = structure.filter(s => s.category === cat);
                let catFtdAch = 0;
                let catMtdTar = 0;
                let catMtdCy = 0;

                types.forEach((t, index) => {
                    // Calc FTD Ach for this type
                    let tFtdAch = 0;
                    ftdData.forEach(r => {
                        const rCat = normalizeCategory(getCol(r, ['itemser_description', 'product category', 'category']));
                        const rType = getCol(r, ['item_type', 'product type', 'type']).trim().toUpperCase();
                        if (rCat === cat && (cat === 'Accessories.' || rType === t.type.toUpperCase())) {
                            tFtdAch += parseFloat(getCol(r, ['order_quantity', 'qty', 'quantity'])) || 0;
                        }
                    });

                    // Calc MTD CY Qty
                    let tMtdCy = 0;
                    mtdData.forEach(r => {
                        const rCat = normalizeCategory(getCol(r, ['itemser_description', 'product category', 'category']));
                        const rType = getCol(r, ['item_type', 'product type', 'type']).trim().toUpperCase();
                        if (rCat === cat && (cat === 'Accessories.' || rType === t.type.toUpperCase())) {
                            tMtdCy += parseFloat(getCol(r, ['order_quantity', 'qty', 'quantity'])) || 0;
                        }
                    });

                    // Target from target.html structure
                    // target key format: store||HUBLI||Ready made||SHIRTS
                    const tarCat = cat === 'Accessories.' ? 'Accessories' : cat;
                    const tarType = cat === 'Accessories.' ? '' : t.type;
                    const targetKey = `store||${store}||${tarCat}||${tarType}`;
                    const tMtdTar = parseFloat(targets[targetKey]) || 0;
                    
                    const tarAchPct = tMtdTar ? (tMtdCy / tMtdTar * 100) : 0;
                    const tarAchStr = tMtdTar ? formatPct(tarAchPct) : '#DIV/0!';

                    catFtdAch += tFtdAch;
                    catMtdTar += tMtdTar;
                    catMtdCy += tMtdCy;

                    html += `<tr>`;
                    if (index === 0 && types.length > 1) {
                        html += `<td>${t.category}</td>`;
                        html += `<td>${t.type}</td>`;
                        html += `<td class="text-right">0</td>`;
                        html += `<td class="text-right">${tFtdAch || 0}</td>`;
                        html += `<td class="divider-col"></td>`;
                        html += `<td class="text-right">${tMtdTar || 0}</td>`;
                        html += `<td class="text-right">0</td>`;
                        html += `<td class="text-right">${tMtdCy || 0}</td>`;
                        html += `<td class="text-right">${tarAchStr}</td>`;
                        html += `<td></td>`;
                    } else if (types.length === 1) {
                        html += `<td class="font-bold">${cat}</td>`;
                        html += `<td>${t.type}</td>`;
                        html += `<td class="text-right">0</td>`;
                        html += `<td class="text-right">${tFtdAch || 0}</td>`;
                        html += `<td class="divider-col"></td>`;
                        html += `<td class="text-right">${tMtdTar || 0}</td>`;
                        html += `<td class="text-right">0</td>`;
                        html += `<td class="text-right">${tMtdCy || 0}</td>`;
                        html += `<td class="text-right">${tarAchStr}</td>`;
                        html += `<td></td>`;
                    } else {
                        html += `<td>${t.type}</td>`;
                        html += `<td class="text-right">0</td>`;
                        html += `<td class="text-right">${tFtdAch || 0}</td>`;
                        html += `<td class="divider-col"></td>`;
                        html += `<td class="text-right">${tMtdTar || 0}</td>`;
                        html += `<td class="text-right">0</td>`;
                        html += `<td class="text-right">${tMtdCy || 0}</td>`;
                        html += `<td class="text-right">${tarAchStr}</td>`;
                        html += `<td></td>`;
                    }
                    html += `</tr>`;
                });

                if (types.length > 1) {
                    const catTarAchPct = catMtdTar ? (catMtdCy / catMtdTar * 100) : 0;
                    const catTarAchStr = catMtdTar ? formatPct(catTarAchPct) : '#DIV/0!';
                    html += `<tr class="cat-total-row">`;
                    html += `<td colspan="2">${cat} Total</td>`;
                    html += `<td class="text-right">0</td>`;
                    html += `<td class="text-right">${catFtdAch.toFixed(1)}</td>`;
                    html += `<td class="divider-col"></td>`;
                    html += `<td class="text-right">${catMtdTar}</td>`;
                    html += `<td class="text-right">0</td>`;
                    html += `<td class="text-right">${catMtdCy.toFixed(1)}</td>`;
                    html += `<td class="text-right">${catTarAchStr}</td>`;
                    html += `<td></td>`;
                    html += `</tr>`;
                }

                ftdGrandAch += catFtdAch;
                mtdGrandTar += catMtdTar;
                mtdGrandCy += catMtdCy;
            });

            const grandTarAchPct = mtdGrandTar ? (mtdGrandCy / mtdGrandTar * 100) : 0;
            const grandTarAchStr = mtdGrandTar ? formatPct(grandTarAchPct) : '#DIV/0!';

            html += `
                    <tr class="grand-total-row">
                        <td colspan="2" style="background:#fef08a;">Grand Total</td>
                        <td class="text-right" style="background:#fef08a;">0</td>
                        <td class="text-right" style="background:#fef08a;">${ftdGrandAch.toFixed(1)}</td>
                        <td class="divider-col" style="background:#fef08a;"></td>
                        <td class="text-right" style="background:#fef08a;">${mtdGrandTar}</td>
                        <td class="text-right" style="background:#fef08a;">0</td>
                        <td class="text-right" style="background:#fef08a;">${mtdGrandCy.toFixed(1)}</td>
                        <td class="text-right" style="background:#fef08a;">${grandTarAchStr}</td>
                        <td style="background:#fef08a;"></td>
                    </tr>
                </tbody>
            </table>`;

            document.getElementById('report-container').innerHTML = html;
        }

        // Apply dark mode if set
        function loadTheme() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.body.classList.add('dark-mode');
            }
        }
        loadTheme();
    </script>
</body>
</html>
